<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinking-Kendo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f1f3f5;
        color: #243b53;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      main {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: clamp(1rem, 3vw, 2.5rem);
      }

      h1 { margin: 0 0 1rem; font-size: clamp(1.2rem, 2.5vw, 1.65rem); }
      h1 a { color: inherit; text-decoration: none; }
      h1 a:hover { text-decoration: underline; }

      .search-controls {
        display: flex;
        gap: 0.75rem;
      }

      #search {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid #c8cdd2;
        border-radius: 0.65rem;
        background: #fff;
        font: inherit;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
      }

      #search:focus {
        outline: 3px solid #a7c7ff;
        border-color: #3578d4;
      }

      #sort {
        padding: 0.85rem 1rem;
        border: 1px solid #c8cdd2;
        border-radius: 0.65rem;
        background: #fff;
        color: #243b53;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
      }
      #sort:hover { background: #edf3fb; }
      #sort:focus-visible { outline: 3px solid #a7c7ff; border-color: #3578d4; }

      #status { min-height: 1.5rem; margin: 0.8rem 0 1rem; color: #5b636c; }

      #cards {
        column-count: 3;
        column-gap: 1rem;
      }

      .card {
        position: relative;
        display: inline-block;
        min-width: 0;
        width: 100%;
        margin: 0 0 1rem;
        break-inside: avoid;
        padding: 2.25rem 1.1rem 2.1rem;
        border: 1px solid #d9dde1;
        border-radius: 0.75rem;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
      }

      .card-content {
        margin: 0;
        overflow-wrap: anywhere;
        line-height: 1.6;
      }

      .card-content :first-child { margin-top: 0; }
      .card-content :last-child { margin-bottom: 0; }
      .card-content img { max-width: 100%; height: auto; }
      .card-content pre {
        overflow-x: auto;
        padding: 0.8rem;
        border-radius: 0.4rem;
        background: #f3f5f7;
      }
      .card-content code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .card-content a {
        color: #9a4b2a;
        text-decoration-thickness: 0.12em;
        text-underline-offset: 0.15em;
      }
      .card-content a:hover { color: #73351d; }

      .card-id {
        position: absolute;
        right: 1.1rem;
        top: 0.7rem;
        padding: 0.2rem 0.45rem;
        border-radius: 999px;
        background: #e7c8d8;
        color: #75304f;
        font-size: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }
      .card-id:hover { background: #d9aec4; color: #5d1f3c; text-decoration: underline; }

      .card-date {
        position: absolute;
        right: 1.1rem;
        bottom: 0.7rem;
        color: #667085;
        font-size: 0.72rem;
      }

      #cards.single-card { column-count: 1; }

      #sentinel { height: 1px; }

      @media (max-width: 900px) {
        #cards { column-count: 2; }
      }

      @media (max-width: 600px) {
        main { padding: 1rem; }
        #cards { column-count: 1; }
        .search-controls { gap: 0.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><a href="./">Thinking-Kendo</a></h1>
      <div class="search-controls">
        <input id="search" type="search" placeholder="Search all notes…" autocomplete="off" />
        <button id="sort" type="button">sort</button>
      </div>
      <p id="status" aria-live="polite">Loading notes…</p>
      <section id="cards" aria-label="Notes"></section>
      <div id="sentinel" aria-hidden="true"></div>
    </main>

    <script>
      const PAGE_SIZE = 24;
      const search = document.querySelector('#search');
      const sort = document.querySelector('#sort');
      const status = document.querySelector('#status');
      const cards = document.querySelector('#cards');
      const sentinel = document.querySelector('#sentinel');
      let notes = [];
      let results = [];
      let visibleCount = 0;
      let sortedByUpdateDate = false;
      function shuffled(items) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function makeCard(note) {
        const card = document.createElement('article');
        card.className = 'card';
        card.id = String(note.id);
        card.setAttribute('aria-label', note.filename);
        card.style.backgroundColor = note.color;
        const content = document.createElement('div');
        content.className = 'card-content';
        // This is generated locally from the Markdown source by export_notes.py.
        content.innerHTML = note.html_content;
        const noteId = document.createElement('a');
        noteId.className = 'card-id';
        noteId.href = `./#${note.id}`;
        noteId.textContent = `#${note.id}`;
        noteId.setAttribute('aria-label', `View only note ${note.id}`);
        const updateDate = document.createElement('time');
        updateDate.className = 'card-date';
        updateDate.dateTime = note.update_date;
        updateDate.textContent = `Updated ${note.update_date.slice(0, 10)}`;
        card.append(content);
        card.append(noteId);
        card.append(updateDate);
        return card;
      }

      function hashNoteId() {
        const match = location.hash.match(/^#(\d+)$/);
        return match ? Number(match[1]) : null;
      }

      function newestFirst(items) {
        return [...items].sort((first, second) =>
          Date.parse(second.update_date) - Date.parse(first.update_date)
        );
      }

      function render(reset = false) {
        if (reset) {
          visibleCount = PAGE_SIZE;
          cards.replaceChildren();
        }
        const fragment = document.createDocumentFragment();
        for (const note of results.slice(cards.childElementCount, visibleCount)) {
          fragment.append(makeCard(note));
        }
        cards.append(fragment);
        const shown = Math.min(visibleCount, results.length);
        status.textContent = results.length
          ? `Showing ${shown} of ${results.length} note${results.length === 1 ? '' : 's'}`
          : 'No matching notes.';
      }

      function filterNotes() {
        const query = search.value.trim().toLocaleLowerCase();
        const contentNotes = notes.filter((note) => note.content.trim());
        const noteId = hashNoteId();
        results = noteId === null
          ? shuffled(contentNotes.filter((note) =>
            Object.values(note).some((value) => String(value).toLocaleLowerCase().includes(query))
          ))
          : contentNotes.filter((note) => note.id === noteId);
        if (sortedByUpdateDate && noteId === null) results = newestFirst(results);
        cards.classList.toggle('single-card', noteId !== null && results.length === 1);
        render(true);
      }

      search.addEventListener('input', filterNotes);
      sort.addEventListener('click', () => {
        sortedByUpdateDate = true;
        filterNotes();
      });
      window.addEventListener('hashchange', filterNotes);

      new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting && visibleCount < results.length) {
          visibleCount += PAGE_SIZE;
          render();
        }
      }, { rootMargin: '500px' }).observe(sentinel);

      fetch('./notes.json', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('Could not load notes.json');
          return response.json();
        })
        .then((data) => {
          notes = Array.isArray(data) ? data : [];
          filterNotes();
        })
        .catch((error) => {
          status.textContent = `${error.message}. Serve this folder with a local web server.`;
          console.error(error);
        });
    </script>
  </body>
</html>
